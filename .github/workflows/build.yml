name: Build

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
    branches:
      - master

defaults:
  run:
    shell: pwsh

permissions: read-all

jobs:
  build:
    runs-on: windows-latest
    env:
      Configuration: Release
      Platform: x64
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          # As usual, obtained from: https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/5.0/releases.json
          dotnet-version: "6.0.100" # since we now use this
      - name: Log in to package source
        shell: pwsh
        run: |
            dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} `
            --store-password-in-clear-text --name github "https://nuget.pkg.github.com/Atlas-Rhythm/index.json"
      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.config', 'Common.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build universal package
        run: msbuild BSIPA-Meta/BSIPA-Meta.csproj -restore -t:Build -m -p:Configuration=Release -p:Platform=x64 -p:RunAnalyzersDuringBuild=true
      - name: Upload net472
        uses: actions/upload-artifact@v4
        with:
          name: BSIPA-net472-${{ env.Platform }}
          path: BSIPA-Meta/bin/${{ env.Platform }}/${{ env.Configuration }}/BSIPA.zip
